<svg viewBox="0 0 200 160" width="200" height="160" xmlns="http://www.w3.org/2000/svg"
     font-family="Noto Sans">
    <title>Text at the sizes where hinting matters, and the per element control</title>

    <style>
        .unhinted { -resvg-hinting: none }
        /* What an aliased, black and white display wants. */
        .bilevel {
            -resvg-hinting-target: mono;
            -resvg-hinting-symmetric: false;
            -resvg-hinting-preserve-linear-metrics: true;
        }
    </style>

    <text x="10" y="20" font-size="9">Hamburgefonstiv 9</text>
    <text x="10" y="40" font-size="12">Hamburgefonstiv 12</text>
    <text x="10" y="62" font-size="16">Hamburgefonstiv 16</text>

    <!-- `geometricPrecision` opts out of hinting. -->
    <text x="10" y="86" font-size="12" text-rendering="geometricPrecision">Exact outlines 12</text>

    <!-- So does `-resvg-hinting`, from a stylesheet or a `style` attribute. -->
    <text x="10" y="104" font-size="12" class="unhinted">Not hinted 12</text>
    <text x="10" y="121" font-size="12" class="bilevel">Bilevel 12</text>
    <text x="10" y="138" font-size="12"
          style="-resvg-hinting-engine: auto; -resvg-hinting-mode: light">Auto light 12</text>
    <text x="10" y="155" font-size="12"
          style="-resvg-hinting-engine: native; -resvg-hinting-mode: normal">Native 12</text>
</svg>
